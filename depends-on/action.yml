name: "Pull request dependencies"
author: "Igor Velkov"
description: "Hold a pull request until what its Depends-on: lines name is merged, and comment when its Notify-when: lines are met"
inputs:
  mode:
    description: "evaluate: read-only, outputs the decisions; apply: sets statuses and comments from 'result'; all: both in one step"
    required: false
    default: "all"
  result:
    description: "Decisions from an evaluate step, for mode apply"
    required: false
    default: ""
  pull-requests:
    description: "Pull request numbers to check, or 'all'; empty: the event's pull request, or all open ones"
    required: false
    default: ""
  token:
    description: "evaluate: reads pull requests and the repositories their lines name; apply: sets statuses, comments and labels, as a bot"
    required: false
    default: ${{ github.token }}
  context:
    description: "Name of the commit status; make it a required check"
    required: false
    default: "depends-on"
  override-label:
    description: "Label that releases the hold"
    required: false
    default: "depends-on: override"
  override-role:
    description: "Lowest repository role whose override label counts: admin, maintain, write"
    required: false
    default: "maintain"
  commit-links:
    description: "Extra commit page templates, one '<host> <URL>' per line, with {repo} (path without .git), {path} and {sha}"
    required: false
    default: ""
  allowed-hosts:
    description: "More git servers lines may name without approval, space-separated, or '*' for any; GitHub and the commit-links hosts are always allowed"
    required: false
    default: ""
  allow-hosts-label:
    description: "Label by which a maintainer approves the servers a pull request asks for"
    required: false
    default: "depends-on: allow hosts"
  notify-label:
    description: "Label that marks pull requests with Notify-when: lines not announced yet"
    required: false
    default: "notify-pending"
  notify-ttl-days:
    description: "Days after the merge to keep watching Notify-when: lines"
    required: false
    default: "365"
  git-every-hours:
    description: "Scheduled runs fetch from git servers other than GitHub every this many hours"
    required: false
    default: "6"
  git-max-fetches:
    description: "Most git fetches in one run"
    required: false
    default: "10"
  git-fetch-timeout:
    description: "Seconds one git fetch may take"
    required: false
    default: "300"
  max-lines:
    description: "Most Depends-on: and Notify-when: lines one pull request may carry"
    required: false
    default: "20"
outputs:
  result:
    description: "Decisions of mode evaluate, for mode apply"
    value: ${{ steps.depends-on.outputs.result }}
runs:
  using: "composite"
  steps:
    - name: "Check Depends-on: lines"
      id: depends-on
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DEPENDS_ON_MODE: ${{ inputs.mode }}
        DEPENDS_ON_RESULT: ${{ inputs.result }}
        DEPENDS_ON_REPOSITORY: ${{ github.repository }}
        DEPENDS_ON_PULL_REQUESTS: ${{ inputs.pull-requests }}
        DEPENDS_ON_CONTEXT: ${{ inputs.context }}
        DEPENDS_ON_OVERRIDE_LABEL: ${{ inputs.override-label }}
        DEPENDS_ON_OVERRIDE_ROLE: ${{ inputs.override-role }}
        DEPENDS_ON_COMMIT_LINKS: ${{ inputs.commit-links }}
        DEPENDS_ON_ALLOWED_HOSTS: ${{ inputs.allowed-hosts }}
        DEPENDS_ON_ALLOW_HOSTS_LABEL: ${{ inputs.allow-hosts-label }}
        DEPENDS_ON_NOTIFY_LABEL: ${{ inputs.notify-label }}
        DEPENDS_ON_NOTIFY_TTL_DAYS: ${{ inputs.notify-ttl-days }}
        DEPENDS_ON_GIT_EVERY_HOURS: ${{ inputs.git-every-hours }}
        DEPENDS_ON_GIT_MAX_FETCHES: ${{ inputs.git-max-fetches }}
        DEPENDS_ON_GIT_FETCH_TIMEOUT: ${{ inputs.git-fetch-timeout }}
        DEPENDS_ON_MAX_LINES: ${{ inputs.max-lines }}
      run: ${{ github.action_path }}/depends-on.sh
